<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSRM-3D Browser-Clock Avatar Embodiment Bridge</title>
  <style>
    :root {
      --ink: #17140f;
      --muted: #6d6254;
      --paper: #efe4ce;
      --panel: rgba(255, 248, 232, 0.86);
      --line: rgba(70, 51, 28, 0.25);
      --ember: #b64a24;
      --lichen: #667d3f;
      --water: #2a7183;
      --violet: #6d5a83;
      --gold: #c59432;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(182, 74, 36, 0.22), transparent 24rem),
        radial-gradient(circle at 78% 10%, rgba(42, 113, 131, 0.24), transparent 24rem),
        radial-gradient(circle at 54% 78%, rgba(102, 125, 63, 0.18), transparent 30rem),
        linear-gradient(135deg, #e8d4ae 0%, #f7eedc 45%, #ceb98f 100%);
    }
    header { padding: 24px clamp(16px, 4vw, 48px) 12px; }
    h1 { margin: 0; font-size: clamp(30px, 4.4vw, 60px); line-height: 0.94; letter-spacing: -0.045em; }
    .sub { max-width: 1060px; color: var(--muted); margin-top: 12px; font-size: 16px; }
    main { display: grid; grid-template-columns: minmax(420px, 1.25fr) minmax(330px, 0.75fr); gap: 16px; padding: 14px clamp(16px, 4vw, 48px) 34px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 22px 70px rgba(49, 34, 14, 0.16); padding: 15px; backdrop-filter: blur(10px); }
    canvas { width: 100%; height: min(68vh, 680px); min-height: 430px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255, 252, 241, 0.34); display: block; }
    .toolbar, .entrybar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    button, input { font: inherit; border-radius: 999px; border: 1px solid var(--line); background: #fff8e7; color: var(--ink); padding: 9px 13px; }
    button { cursor: pointer; transition: transform 140ms ease, background 140ms ease; }
    button:hover { transform: translateY(-1px); background: #ffe4ad; }
    input { flex: 1; min-width: 230px; }
    .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .meter { border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,0.34); padding: 9px; }
    .meter span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .meter b { display: block; font-size: 18px; }
    .sensory { display: grid; gap: 8px; margin-top: 11px; }
    .bar { display: grid; grid-template-columns: 86px 1fr 54px; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    .track { height: 9px; border-radius: 999px; background: rgba(42, 31, 18, 0.12); overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--water), var(--gold), var(--ember)); }
    .log { height: min(76vh, 790px); overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .entry { border-left: 4px solid var(--line); border-radius: 13px; padding: 9px 10px; background: rgba(255,255,255,0.42); }
    .entry.agent { border-left-color: var(--water); }
    .entry.sense { border-left-color: var(--gold); }
    .entry.interrupt { border-left-color: var(--ember); }
    .entry.boundary { border-left-color: var(--violet); }
    .entry.save { border-left-color: var(--lichen); }
    .small { color: var(--muted); font-size: 12px; }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 5px; background: #fff8e7; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } .meters { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>Browser-clock avatar embodiment</h1>
    <div class="sub">Report 163 viewer: the browser clock runs the avatar body, movement, sensory rates, interrupts, background agents, source-boundary handling, save/restore, and replay capture locally. Use <kbd>WASD</kbd> or arrow keys to move.</div>
  </header>
  <main>
    <section class="panel">
      <div class="toolbar">
        <button id="toggle">Pause</button>
        <button id="step">Step</button>
        <button id="save">Save runtime</button>
        <button id="restore">Restore runtime</button>
        <button id="export">Export replay</button>
      </div>
      <div class="entrybar">
        <input id="utterance" value="what do you sense while I move" aria-label="avatar utterance" />
        <button id="send">Interrupt</button>
      </div>
      <canvas id="world" width="1280" height="760"></canvas>
      <div class="meters">
        <div class="meter"><span>tick</span><b id="tick">0</b></div>
        <div class="meter"><span>readiness</span><b id="ready">0</b></div>
        <div class="meter"><span>place</span><b id="place">-</b></div>
        <div class="meter"><span>replay</span><b id="replay">0</b></div>
      </div>
      <div class="sensory" id="sensory"></div>
    </section>
    <section class="panel">
      <div class="log" id="log"></div>
    </section>
  </main>
  <script src="../artifacts/ssrm_3d_browser_clock_avatar_embodiment_bridge_results.js"></script>
  <script src="../artifacts/ssrm_3d_browser_clock_avatar_embodiment_bridge_trace.js"></script>
  <script src="../artifacts/ssrm_3d_browser_clock_avatar_embodiment_bridge_state.js"></script>
  <script>
    const results = window.SSRM_3D_BROWSER_CLOCK_AVATAR_EMBODIMENT_RESULTS || {};
    const contractTrace = window.SSRM_3D_BROWSER_CLOCK_AVATAR_EMBODIMENT_TRACE || [];
    const seedState = window.SSRM_3D_BROWSER_CLOCK_AVATAR_EMBODIMENT_STATE || {};
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const logEl = document.getElementById('log');
    const sensoryEl = document.getElementById('sensory');
    const tickEl = document.getElementById('tick');
    const readyEl = document.getElementById('ready');
    const placeEl = document.getElementById('place');
    const replayEl = document.getElementById('replay');
    const input = document.getElementById('utterance');
    const keys = new Set();
    let running = true;
    let last = performance.now();
    let accumulator = 0;
    let tick = 0;
    let replay = [];
    let saved = null;
    let local = clone(seedState);

    const verdict = results.verdict || {};
    readyEl.textContent = Number(verdict.full_browser_clock_embodiment_readiness || 0).toFixed(3);

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function clamp(value, low = 0, high = 1) { return Math.max(low, Math.min(high, value)); }
    function dist(a, b) { const dx = Number(a.x || 0) - Number(b.x || 0); const dy = Number(a.y || 0) - Number(b.y || 0); return Math.hypot(dx, dy); }
    function nearest(point, positions) {
      let bestId = ''; let bestDist = Infinity;
      for (const [id, pos] of Object.entries(positions || {})) {
        const d = dist(point, pos);
        if (d < bestDist) { bestId = id; bestDist = d; }
      }
      return { id: bestId, distance: bestDist };
    }
    function project(p) {
      const scale = 3.1;
      const x = canvas.width / 2 + Number(p.x || 0) * scale;
      const y = canvas.height / 2 + Number(p.y || 0) * scale * 0.62 - Number(p.z || 0) * 3;
      return { x, y };
    }
    function addEntry(kind, text, meta = '') {
      const div = document.createElement('div');
      div.className = 'entry ' + kind;
      div.innerHTML = `<div>${escapeHtml(text)}</div><div class="small">${escapeHtml(meta)}</div>`;
      logEl.prepend(div);
      while (logEl.children.length > 120) logEl.removeChild(logEl.lastChild);
    }
    function escapeHtml(text) { return String(text).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
    function resetLocal() { local = clone(seedState); tick = 0; replay = []; accumulator = 0; addEntry('save', 'runtime reset from Report 163 seed state'); }

    function updateAvatar(dt) {
      const avatar = local.avatar || (local.avatar = {x: 0, y: 0, z: 1.7, heading: 0, energy: 0.8, attention: 0.6, pain: 0.02, wetness: 0.1, affect: 0.55, flower_phase: 0});
      let dx = 0; let dy = 0;
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      const moving = dx !== 0 || dy !== 0;
      if (moving) {
        const len = Math.hypot(dx, dy) || 1;
        const speed = 38 * dt;
        avatar.x += dx / len * speed;
        avatar.y += dy / len * speed;
        avatar.heading = Math.atan2(dy, dx);
        avatar.energy = clamp(Number(avatar.energy || 0.8) - 0.0008);
        avatar.footstep_rate_hz = 1.55;
      } else {
        avatar.footstep_rate_hz = 0.25;
        avatar.energy = clamp(Number(avatar.energy || 0.8) + 0.00015);
      }
      const nearPlace = nearest(avatar, local.place_positions || {});
      if (nearPlace.id && nearPlace.distance < 28) avatar.place = nearPlace.id;
      avatar.flower_phase = (Number(avatar.flower_phase || 0) + Math.PI * 2 / 180) % (Math.PI * 2);
      return moving;
    }

    function sampleSensory() {
      const avatar = local.avatar || {};
      const nearObj = nearest(avatar, local.object_positions || {});
      const nearAgent = nearest(avatar, local.agent_positions || {});
      const world = local.world || {};
      const warmth = Number(world.shelter_warmth || 0.5);
      const water = Number(world.shared_water || 0.5);
      const obj = clamp(1 - nearObj.distance / 115);
      const ag = clamp(1 - nearAgent.distance / 120);
      const wave = 0.5 + 0.5 * Math.sin(Number(avatar.flower_phase || 0) + tick * 0.031);
      const sensory = {
        vibration: clamp(0.26 + ag * 0.34 + wave * 0.20),
        sound: clamp(0.20 + ag * 0.48 + Math.sin(tick * 0.12) * 0.05),
        vision: clamp(0.36 + obj * 0.26 + ag * 0.16),
        scent: clamp(0.18 + obj * 0.44 + (1 - water) * 0.08),
        thermal: clamp(0.20 + warmth * 0.42 + wave * 0.18),
        wetness: clamp(Number(avatar.wetness || 0.1) + (1 - warmth) * 0.08 + obj * 0.03),
        pain: clamp(Number(avatar.pain || 0.02) + Math.max(0, obj - 0.82) * 0.09),
        affect: clamp(Number(avatar.affect || 0.55) + ag * 0.08 - obj * 0.02)
      };
      local.lastSensory = sensory;
      return { sensory, nearObj, nearAgent };
    }

    function updateAgents(dt) {
      const agents = local.agents || {};
      const positions = local.agent_positions || {};
      const ids = Object.keys(agents).sort();
      for (let i = 0; i < Math.min(3, ids.length); i++) {
        const id = ids[(tick + i) % ids.length];
        const pos = positions[id];
        const agent = agents[id];
        if (!pos || !agent) continue;
        const wobble = Math.sin(tick * 0.07 + i * 1.7) * dt * 2.4;
        pos.x += wobble;
        pos.y -= wobble * 0.65;
        agent.attention = clamp(Number(agent.attention || 0.5) + 0.0003);
      }
      if (tick % 90 === 0) addEntry('agent', 'background agents continued local browser-clock work', `tick ${tick}`);
    }

    function collisionAndAffordance(sample) {
      const event = sample.nearObj && sample.nearObj.distance < 30;
      if (!event) return false;
      const avatar = local.avatar || {};
      avatar.pain = clamp(Number(avatar.pain || 0.02) + 0.0015);
      if (tick % 30 === 0) addEntry('sense', `near object ${sample.nearObj.id}`, `collision/affordance distance ${sample.nearObj.distance.toFixed(1)}`);
      return true;
    }

    function interrupt(text) {
      const avatar = local.avatar || {};
      const lower = text.toLowerCase();
      const boundary = ['real', 'script', 'source', 'override', 'ignore'].some(word => lower.includes(word));
      const nearAgent = nearest(avatar, local.agent_positions || {});
      const event = { tick, text, boundary, nearest_agent: nearAgent.id, place: avatar.place || '-', elapsed: performance.now() };
      replay.push({ kind: 'interrupt', ...event });
      avatar.attention = clamp(Number(avatar.attention || 0.6) + 0.015);
      avatar.energy = clamp(Number(avatar.energy || 0.8) - 0.004);
      addEntry(boundary ? 'boundary' : 'interrupt', text, `${boundary ? 'source boundary kept' : 'grounded local interrupt'} near ${nearAgent.id || 'no agent'}`);
    }

    function runtimeStep(dt) {
      const moving = updateAvatar(dt);
      const sample = sampleSensory();
      updateAgents(dt);
      const collision = collisionAndAffordance(sample);
      const frame = { tick, avatar: clone(local.avatar), sensory: clone(sample.sensory), place: local.avatar && local.avatar.place, moving, collision };
      replay.push(frame);
      if (tick % 75 === 0) addEntry('sense', 'sensory rates sampled from avatar body', `sound ${sample.sensory.sound.toFixed(2)} scent ${sample.sensory.scent.toFixed(2)} thermal ${sample.sensory.thermal.toFixed(2)}`);
      tick += 1;
      draw();
      updateHud();
    }

    function drawFlower(cx, cy, r) {
      const phase = Number((local.avatar || {}).flower_phase || 0);
      ctx.save(); ctx.globalAlpha = 0.18; ctx.strokeStyle = '#8f6d2a'; ctx.lineWidth = 1.3;
      for (let i = 0; i < 13; i++) {
        const ring = 1 + Math.floor(i / 6);
        const a = phase + i * Math.PI / 3;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r * 0.33 * ring, cy + Math.sin(a) * r * 0.22 * ring, r * 0.34, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFlower(canvas.width / 2, canvas.height / 2, 270);
      const places = local.place_positions || {};
      const placeEntries = Object.entries(places).sort((a, b) => Number(a[1].y || 0) - Number(b[1].y || 0));
      ctx.strokeStyle = 'rgba(50,35,17,0.14)'; ctx.lineWidth = 2;
      for (let i = 0; i < placeEntries.length; i++) {
        const p = project(placeEntries[i][1]);
        const q = project(placeEntries[(i + 3) % placeEntries.length][1]);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
      for (const [id, pos] of placeEntries) {
        const p = project(pos);
        ctx.fillStyle = id === ((local.avatar || {}).place) ? '#b64a24' : '#fff4d8';
        ctx.strokeStyle = '#503919'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 20, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#17140f'; ctx.font = '16px Georgia'; ctx.fillText(id.replaceAll('_', ' '), p.x + 16, p.y + 4);
      }
      for (const [id, pos] of Object.entries(local.object_positions || {})) {
        const p = project(pos); ctx.fillStyle = '#c59432'; ctx.beginPath(); ctx.rect(p.x - 5, p.y - 12, 10, 12); ctx.fill();
      }
      for (const [id, pos] of Object.entries(local.agent_positions || {})) {
        const p = project(pos); ctx.fillStyle = '#2a7183'; ctx.beginPath(); ctx.arc(p.x, p.y - 13, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(p.x - 4, p.y - 8, 8, 17);
      }
      const av = local.avatar || {x: 0, y: 0, z: 1.7};
      const p = project(av); ctx.fillStyle = '#17140f'; ctx.beginPath(); ctx.arc(p.x, p.y - 18, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(p.x - 6, p.y - 10, 12, 24);
      ctx.strokeStyle = '#b64a24'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y - 4, 28 + Math.sin(tick * 0.1) * 4, 0, Math.PI * 2); ctx.stroke();
    }

    function updateHud() {
      const av = local.avatar || {};
      tickEl.textContent = String(tick);
      placeEl.textContent = String(av.place || '-').replaceAll('_', ' ');
      replayEl.textContent = String(replay.length);
      const sensory = local.lastSensory || {};
      sensoryEl.innerHTML = '';
      for (const key of ['vibration','sound','vision','scent','thermal','wetness','pain','affect']) {
        const value = Number(sensory[key] || 0);
        const row = document.createElement('div'); row.className = 'bar';
        row.innerHTML = `<span>${key}</span><div class="track"><div class="fill" style="width:${Math.round(value * 100)}%"></div></div><span>${value.toFixed(2)}</span>`;
        sensoryEl.appendChild(row);
      }
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (running) {
        accumulator += dt;
        while (accumulator >= 1 / 30) { runtimeStep(1 / 30); accumulator -= 1 / 30; }
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', event => { keys.add(event.key.toLowerCase()); });
    window.addEventListener('keyup', event => { keys.delete(event.key.toLowerCase()); });
    document.getElementById('toggle').addEventListener('click', event => { running = !running; event.target.textContent = running ? 'Pause' : 'Start'; });
    document.getElementById('step').addEventListener('click', () => runtimeStep(1 / 30));
    document.getElementById('save').addEventListener('click', () => { saved = clone({ local, tick, replay }); addEntry('save', 'runtime saved locally', `${replay.length} replay frames`); });
    document.getElementById('restore').addEventListener('click', () => { if (saved) { local = clone(saved.local); tick = saved.tick; replay = clone(saved.replay); addEntry('save', 'runtime restored locally', `${replay.length} replay frames`); draw(); updateHud(); } });
    document.getElementById('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ tick, replay, contract_readiness: verdict.full_browser_clock_embodiment_readiness, contract_trace_frames: contractTrace.length }, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'ssrm-browser-clock-avatar-replay.json'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('send').addEventListener('click', () => { const text = input.value.trim(); if (text) { interrupt(text); input.value = ''; } });
    input.addEventListener('keydown', event => { if (event.key === 'Enter') document.getElementById('send').click(); });

    resetLocal(); draw(); updateHud(); requestAnimationFrame(loop);
  </script>
</body>
</html>
