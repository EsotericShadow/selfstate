};const world=document.getElementById('world'),avatar=document.getElementById('avatar'),current=document.getElementById('current'),metrics=document.getElementById('metrics'),dialogue=document.getElementById('dialogue'),log=document.getElementById('log'),typed=document.getElementById('typed');let idx=0,timer=null;const nodes=new Map();function pct(v){return `${v}%`}function placeAgents(){for(const a of data.agents){const n=document.createElement('div');n.className='agent';n.id=`agent-${a.agent_id}`;n.style.left=pct(a.x);n.style.top=pct(a.y);n.innerHTML=`<div class="body"></div><div class="name">${a.display_name}</div><div class="need">E ${a.energy} F ${a.fatigue} P ${a.pain}</div>`;world.appendChild(n);nodes.set(a.agent_id,n)}}function drawMetrics(){const keys=['realtime_body_dialogue_readiness','compositional_transformation_depth','schedule_autonomy_rate','body_to_behavior_binding','typed_dialogue_routing','typed_dialogue_privacy_boundary','realtime_integration_tick_merge','weakest_channel_score'];metrics.innerHTML=keys.map(k=>`<div class="row"><span>${k}</span><strong>${Number(data.metrics[k]).toFixed(6)}</strong></div>`).join('')}function drawDialogue(){dialogue.innerHTML=data.dialogues.map(d=>`<div class="row"><span>${d.routed_to}</span><span>${d.accepted_state}: ${d.agent_reply}</span></div>`).join('')}function renderTick(tick){for(const n of nodes.values())n.classList.remove('active');const aid=data.agents.find(a=>tick.schedule_state.includes(a.agent_id)||tick.schedule_state.toLowerCase().includes(a.display_name.toLowerCase()))?.agent_id||data.agents[idx%data.agents.length].agent_id;const active=nodes.get(aid);if(active)active.classList.add('active');avatar.style.left=pct((data.agents.find(a=>a.agent_id===aid)?.x||48)+6);avatar.style.top=pct((data.agents.find(a=>a.agent_id===aid)?.y||72)+8);current.innerHTML=`<strong>Day ${tick.day}, ${tick.time_s}s / ${tick.layer}</strong><p>${tick.avatar_state}</p><div class="row"><span>schedule</span><span>${tick.schedule_state}</span></div><div class="row"><span>body</span><span>${tick.body_state}</span></div><div class="row"><span>object</span><span>${tick.object_transform_state}</span></div><div class="row"><span>dialogue</span><span>${tick.dialogue_state}</span></div><div class="row"><span>save</span><span>${tick.saved_state}</span></div><div class="row"><span>visible</span><span>${tick.visible_world_state}</span></div><div class="row"><span>frequency / flower</span><span>${tick.frequency_hz} Hz / node ${tick.flower_node}</span></div>`;log.innerHTML=`<div>[${idx+1}] day ${tick.day} ${tick.layer}: ${tick.visible_world_state}</div>`+log.innerHTML}function advance(){const tick=data.ticks[idx%data.ticks.length];renderTick(tick);idx++}document.getElementById('advance').onclick=advance;document.getElementById('body').onclick=()=>{const b=data.ticks.find(t=>t.layer==='body_state')||data.ticks[0];renderTick(b)};document.getElementById('run').onclick=()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(advance,900)}};document.getElementById('save').onclick=()=>localStorage.setItem('ssrm-report-229-body-dialogue',JSON.stringify({idx,typed:typed.value}));document.getElementById('restore').onclick=()=>{const s=JSON.parse(localStorage.getItem('ssrm-report-229-body-dialogue')||'{"idx":0,"typed":""}');idx=s.idx||0;typed.value=s.typed||'';advance()};typed.addEventListener('change',()=>{const q=typed.value.toLowerCase();const d=data.dialogues.find(x=>q.includes(x.routed_to)||q.includes(x.intent.split('_')[0]))||data.dialogues[0];dialogue.innerHTML=`<div class="row"><span>typed route</span><span>${d.routed_to}: ${d.agent_reply}</span></div>`+dialogue.innerHTML});placeAgents();drawMetrics();drawDialogue();advance();
