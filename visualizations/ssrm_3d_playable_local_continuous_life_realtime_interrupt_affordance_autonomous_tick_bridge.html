};const world=document.getElementById('world'),avatar=document.getElementById('avatar'),current=document.getElementById('current'),metrics=document.getElementById('metrics'),interrupts=document.getElementById('interrupts'),log=document.getElementById('log');let idx=0,timer=null;const nodes=new Map();function pct(v){return `${v}%`}function placeAgents(){for(const a of data.agents){const n=document.createElement('div');n.className='agent';n.id=`agent-${a.agent_id}`;n.style.left=pct(a.x);n.style.top=pct(a.y);n.innerHTML=`<div class="body"></div><div class="name">${a.display_name}</div><div class="need">${a.interrupt_style}</div>`;world.appendChild(n);nodes.set(a.agent_id,n)}}function drawMetrics(){const keys=['continuous_life_loop_readiness','realtime_move_frame_rate','interrupt_delivery_rate','affordance_lattice_depth','autonomous_background_tick_rate','background_tick_consequence_binding','idle_agent_tick_independence','weakest_channel_score'];metrics.innerHTML=keys.map(k=>`<div class="row"><span>${k}</span><strong>${Number(data.metrics[k]).toFixed(6)}</strong></div>`).join('')}function drawInterrupts(){interrupts.innerHTML=data.interrupts.slice(0,6).map(i=>`<div class="row"><span>${i.agent_id}</span><span>${i.delivery_state}: ${i.selected_response}</span></div>`).join('')}function renderTick(tick){for(const n of nodes.values())n.classList.remove('active');const frame=data.frames.find(f=>f.day===tick.day)||data.frames[idx%data.frames.length];avatar.style.left=pct(frame.avatar_x);avatar.style.top=pct(frame.avatar_y);const aid=data.agents.find(a=>tick.agent_state.includes(a.agent_id)||tick.agent_state.toLowerCase().includes(a.display_name.toLowerCase()))?.agent_id||frame.nearest_agent;const active=nodes.get(aid);if(active)active.classList.add('active');current.innerHTML=`<strong>Day ${tick.day}, ${tick.time_s}s / ${tick.layer}</strong><p>${tick.avatar_state}</p><div class="row"><span>agent</span><span>${tick.agent_state}</span></div><div class="row"><span>object</span><span>${tick.object_state}</span></div><div class="row"><span>interrupt</span><span>${tick.interruption_state}</span></div><div class="row"><span>background</span><span>${tick.background_state}</span></div><div class="row"><span>save</span><span>${tick.save_state}</span></div><div class="row"><span>sensory</span><span>${tick.sensory_state}</span></div><div class="row"><span>frequency / flower</span><span>${tick.frequency_hz} Hz / node ${tick.flower_node}</span></div>`;log.innerHTML=`<div>[${idx+1}] day ${tick.day} ${tick.layer}: ${tick.avatar_state}</div>`+log.innerHTML}function advance(){const tick=data.ticks[idx%data.ticks.length];renderTick(tick);idx++}document.getElementById('advance').onclick=advance;document.getElementById('idle').onclick=()=>{const bg=data.ticks.find(t=>t.layer==='background_tick')||data.ticks[0];renderTick(bg)};document.getElementById('run').onclick=()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(advance,850)}};document.getElementById('save').onclick=()=>localStorage.setItem('ssrm-report-228-continuous',JSON.stringify({idx}));document.getElementById('restore').onclick=()=>{const s=JSON.parse(localStorage.getItem('ssrm-report-228-continuous')||'{"idx":0}');idx=s.idx||0;advance()};window.addEventListener('keydown',e=>{const step=2,left=parseFloat(avatar.style.left)||48,top=parseFloat(avatar.style.top)||72;if(e.key==='a'||e.key==='ArrowLeft')avatar.style.left=pct(Math.max(5,left-step));if(e.key==='d'||e.key==='ArrowRight')avatar.style.left=pct(Math.min(95,left+step));if(e.key==='w'||e.key==='ArrowUp')avatar.style.top=pct(Math.max(5,top-step));if(e.key==='s'||e.key==='ArrowDown')avatar.style.top=pct(Math.min(95,top+step))});placeAgents();drawMetrics();drawInterrupts();advance();
